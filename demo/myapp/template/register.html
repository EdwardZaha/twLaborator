<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina autentificare</title>
    <link rel="stylesheet" href="../CSS/register.css">
</head>
<body>
<main class="page">
    <section class="card">
        <h1>Autentificare</h1>
        <form class="register-form" action="#" method="post" enctype="multipart/form-data">
            <div class="row">
                <label for="username">Nume</label>
                <input type="text" name="username" placeholder="ex:ioanaTW"
                       required>
            </div>
            <div class="row">
                <label for="email">Email</label>
                <input type="email" name="email" placeholder="email..." required>
            </div>
            <div class="row two-col">
                <div>
                    <label for="password">Parolă</label>
                    <input for="password" name="password" required>
                </div>
                <div>
                    <label for="confirm_password">Confirmă parola</label>
                    <input type="password" name="confirm_password" required>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn primary">Submit</button>
                <button type="reset" class="btn ghost">Reset</button>
            </div>
            <p class="login-link"> Ai deja cont? <a href="login.html">Mergi la login</a></p>

        </form>
    </section>
</main>
</body>
</html>
